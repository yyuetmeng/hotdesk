AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Hot Desk Monitor on AWS: ECS Fargate behind an HTTPS Application Load Balancer,
  desk state on EFS, secrets in Secrets Manager. Deployed by .github/workflows/deploy.yml.

Parameters:
  ImageUri:
    Type: String
    Description: Container image to run, e.g. 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/hotdesk:<git sha>
  DomainName:
    Type: String
    Description: Address people will use, e.g. hotdesk.example.com
  HostedZoneId:
    Type: String
    Default: ''
    Description: >-
      Route 53 hosted zone for DomainName. When set, the stack creates the DNS record and validates
      the certificate automatically. Leave empty if your DNS is elsewhere.
  CertificateArn:
    Type: String
    Default: ''
    Description: >-
      Existing ACM certificate for DomainName (same region). Leave empty to have the stack create
      one (needs HostedZoneId).
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Who may reach the app. Keep 0.0.0.0/0 if phones and cloud LoRaWAN servers (TTN) must reach it.
  TimeZone:
    Type: String
    Default: Asia/Singapore
  AwayGraceMinutes:
    Type: Number
    Default: 20
  CheckinDurationMinutes:
    Type: Number
    Default: 180

Rules:
  CertificateNeedsDns:
    RuleCondition: !Equals [!Ref CertificateArn, '']
    Assertions:
      - Assert: !Not [!Equals [!Ref HostedZoneId, '']]
        AssertDescription: Set HostedZoneId (Route 53) so the certificate can be validated, or pass an existing CertificateArn.

Conditions:
  CreateCertificate: !Equals [!Ref CertificateArn, '']
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, '']]

Resources:
  # ---------- Network: a small VPC with two public subnets (the ALB needs two AZs).
  # Tasks get public IPs to pull images without a NAT gateway; their security group
  # only accepts traffic from the load balancer.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-a' }]
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-b' }]
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: { RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway }
  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable }
  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable }

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hot Desk load balancer (HTTP/HTTPS in)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AllowedCidr }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedCidr }
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hot Desk app (only from the load balancer)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup }
  StorageSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hot Desk EFS (NFS from the app only)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 2049, ToPort: 2049, SourceSecurityGroupId: !Ref AppSecurityGroup }

  # ---------- Storage: check-ins, sensor links and history (one small JSON file), backed up daily.
  FileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      BackupPolicy: { Status: ENABLED }
      FileSystemTags: [{ Key: Name, Value: !Sub '${AWS::StackName}-data' }]
  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties: { FileSystemId: !Ref FileSystem, SubnetId: !Ref SubnetA, SecurityGroups: [!Ref StorageSecurityGroup] }
  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties: { FileSystemId: !Ref FileSystem, SubnetId: !Ref SubnetB, SecurityGroups: [!Ref StorageSecurityGroup] }
  AccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser: { Uid: '1000', Gid: '1000' } # the image's non-root "node" user
      RootDirectory:
        Path: /hotdesk
        CreationInfo: { OwnerUid: '1000', OwnerGid: '1000', Permissions: '750' }

  # ---------- Secrets, generated on first deploy. Read them in the Secrets Manager console.
  AdminTokenSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${AWS::StackName}/admin-token'
      Description: Hot Desk dashboard password (ADMIN_TOKEN)
      GenerateSecretString: { PasswordLength: 40, ExcludePunctuation: true }
  SensorKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${AWS::StackName}/sensor-api-key'
      Description: Key LoRaWAN webhooks send in X-Api-Key (SENSOR_API_KEY)
      GenerateSecretString: { PasswordLength: 40, ExcludePunctuation: true }

  # ---------- HTTPS
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCertificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - { DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId }
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Scheme: internet-facing
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        # The dashboard keeps a live-update connection open; the app pings it every 25 s.
        - { Key: idle_timeout.timeout_seconds, Value: '120' }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '10' }
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !If [CreateCertificate, !Ref Certificate, !Ref CertificateArn] }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

  # ---------- The app
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: 30
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings: [{ Name: containerInsights, Value: disabled }]
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref AdminTokenSecret, !Ref SensorKeySecret]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: mount-data
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [elasticfilesystem:ClientMount, elasticfilesystem:ClientWrite]
                Resource: !GetAtt FileSystem.Arn
                Condition: { StringEquals: { 'elasticfilesystem:AccessPointArn': !GetAtt AccessPoint.Arn } }
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig: { AccessPointId: !Ref AccessPoint, IAM: ENABLED }
      ContainerDefinitions:
        - Name: hotdesk
          Image: !Ref ImageUri
          Essential: true
          StopTimeout: 30 # time to save state on shutdown
          PortMappings: [{ ContainerPort: 3000, Protocol: tcp }]
          MountPoints: [{ SourceVolume: data, ContainerPath: /data }]
          Environment:
            - { Name: PUBLIC_URL, Value: !Sub 'https://${DomainName}' }
            - { Name: STATE_FILE, Value: /data/state.json }
            - { Name: TZ, Value: !Ref TimeZone }
            - { Name: AWAY_GRACE_MINUTES, Value: !Ref AwayGraceMinutes }
            - { Name: CHECKIN_DURATION_MINUTES, Value: !Ref CheckinDurationMinutes }
          Secrets:
            - { Name: ADMIN_TOKEN, ValueFrom: !Ref AdminTokenSecret }
            - { Name: SENSOR_API_KEY, ValueFrom: !Ref SensorKeySecret }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener, MountTargetA, MountTargetB]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      # Exactly one copy: the app keeps live desk state in memory and in one file.
      # Deploys stop the old task before starting the new one (about a minute of downtime).
      DesiredCount: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - { ContainerName: hotdesk, ContainerPort: 3000, TargetGroupArn: !Ref TargetGroup }

Outputs:
  Url:
    Description: The app
    Value: !Sub 'https://${DomainName}'
  LoadBalancerDnsName:
    Description: If your DNS is not in Route 53, create a CNAME from DomainName to this
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  AdminTokenSecret:
    Description: Dashboard password (open in Secrets Manager → Retrieve secret value)
    Value: !Ref AdminTokenSecret
  SensorApiKeySecret:
    Description: Key for the TTN / ChirpStack webhook X-Api-Key header
    Value: !Ref SensorKeySecret
  LogGroup:
    Value: !Ref LogGroup
  FileSystemId:
    Description: EFS file system holding the desk state (backed up daily by AWS Backup)
    Value: !Ref FileSystem
