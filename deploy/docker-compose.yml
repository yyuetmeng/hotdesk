# Hot Desk Monitor + Caddy (automatic HTTPS).
# 1. cp .env.example .env   and fill it in
# 2. docker compose up -d
services:
  hotdesk:
    image: ${HOTDESK_IMAGE:-ghcr.io/yyuetmeng/hotdesk:latest}
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      SENSOR_API_KEY: ${SENSOR_API_KEY:?set SENSOR_API_KEY in .env}
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      AWAY_GRACE_MINUTES: ${AWAY_GRACE_MINUTES:-20}
      CHECKIN_DURATION_MINUTES: ${CHECKIN_DURATION_MINUTES:-180}
      TZ: ${TZ:-Asia/Singapore}
    volumes:
      - hotdesk-data:/data
      # Uncomment to edit the floor plan without rebuilding the image:
      # - ./building.json:/app/config/building.json:ro
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - hotdesk
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  hotdesk-data:
  caddy-data:
  caddy-config:
