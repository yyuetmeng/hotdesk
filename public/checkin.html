<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Check-in</title>
<script>
  // Apply the theme chosen on the dashboard before the page paints (no flash). No choice: follow the system.
  try { const t = localStorage.getItem('hotdesk.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2; --card: #fcfcfb; --border: #e2e1dc;
    --text: #0b0b0b; --muted: #52514e;
    --available: #0ca30c; --occupied: #2a78d6; --away: #fab219; --offline: #a9a8a2; --danger: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --bg: #111110; --card: #1a1a19; --border: #2e2e2b; --text: #fff; --muted: #c3c2b7; --occupied: #3987e5; --offline: #5c5b56; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #111110; --card: #1a1a19; --border: #2e2e2b; --text: #fff; --muted: #c3c2b7; --occupied: #3987e5; --offline: #5c5b56; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 24px 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 14px; }
  .status { display: inline-flex; align-items: center; gap: 8px; margin: 16px 0; font-weight: 600; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  select { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  button { flex: 1; font: inherit; font-weight: 600; padding: 12px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; background: var(--card); color: var(--text); }
  button.primary { background: var(--text); color: var(--card); border-color: var(--text); }
  #msg { margin-top: 12px; font-size: 14px; min-height: 1.5em; }
  #msg.err { color: var(--danger); }
  #msg.warn { color: var(--text); background: rgb(242 176 30 / 0.14); border: 1px solid rgb(242 176 30 / 0.55); border-radius: 8px; padding: 10px 12px; }
  #msg.warn b { display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="title">Desk</h1>
    <div class="muted" id="where"></div>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Loading…</span></div>
    <div class="muted" id="hint"></div>
    <label for="user">Your name or employee ID</label>
    <input id="user" autocomplete="username">
    <label for="team">Your project team</label>
    <select id="team" required aria-required="true"><option value="">Choose your project team…</option></select>
    <label for="duration">How long will you use this desk?</label>
    <select id="duration"></select>
    <div class="row">
      <button class="primary" id="in" type="button">Check in</button>
      <button id="out" type="button">I'm leaving</button>
    </div>
    <div id="msg" role="status"></div>
  </div>
</main>
<script>
const LABEL = { available: 'Available', occupied: 'Occupied', away: 'Away — held for its user', offline: 'Sensor offline' };
const seatId = new URLSearchParams(location.search).get('seat');
const $ = (id) => document.getElementById(id);
const fmtTime = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmtDuration = (m) => (m % 60 ? `${Math.floor(m / 60) ? `${Math.floor(m / 60)} h ` : ''}${m % 60} min` : `${m / 60} hour${m === 60 ? '' : 's'}`);
try { $('user').value = localStorage.getItem('hotdesk.user') || ''; } catch {}
const savedTeam = (() => { try { return localStorage.getItem('hotdesk.team') || ''; } catch { return ''; } })();

function render(s) {
  $('title').textContent = `Desk ${s.id}`;
  $('where').textContent = `${[s.floorName, s.zoneName, s.teamName].filter(Boolean).join(' · ')}`;
  $('status').textContent = LABEL[s.status] + (s.checkedInUntil ? ` · checked in until ${fmtTime(s.checkedInUntil)}` : '');
  $('dot').style.background = `var(--${s.status})`;
  $('hint').textContent = (s.allocatedTo ? `Pre-allocated to ${s.allocatedTo}. ` : '') + (s.hasSensor
    ? 'This desk has a presence sensor: it frees itself automatically once you have been away for a while.'
    : 'This desk has no sensor: please tap "I\'m leaving" when you go.');
}

async function loadDurations() {
  const { checkinDurationMinutes: def, checkinMaxMinutes: max, projectTeams = [] } = await call('/api/checkin-options');
  const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  $('team').innerHTML = '<option value="">Choose your project team…</option>' +
    projectTeams.map((t) => `<option${t === savedTeam ? ' selected' : ''}>${esc(t)}</option>`).join('');
  const opts = new Set([def]);
  for (let m = 60; m <= max; m += 60) opts.add(m);
  $('duration').innerHTML = [...opts].sort((a, b) => a - b)
    .map((m) => `<option value="${m}"${m === def ? ' selected' : ''}>${fmtDuration(m)}${m === def ? ' (default)' : ''}</option>`).join('');
}

async function call(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// A desk that isn't pre-allocated to the person's project gets one warning first: they can
// go to one of the project's free pre-allocated desks, or tap again to check in here anyway.
let confirmedTeam = '';
const IN_LABEL = 'Check in';
async function allocationWarning(team) {
  const seats = await call('/api/availability');
  const here = seats.find((x) => x.id === seatId);
  const mine = seats.filter((x) => x.allocatedTo === team);
  if (!here || !mine.length || here.allocatedTo === team) return null;
  return { here, free: mine.filter((x) => x.status === 'available' || x.status === 'offline') };
}
$('team').addEventListener('change', () => { confirmedTeam = ''; $('in').textContent = IN_LABEL; $('msg').textContent = ''; $('msg').className = ''; });

async function act(kind) {
  const user = $('user').value.trim();
  $('msg').className = '';
  const projectTeam = $('team').value;
  if (!user) { $('msg').className = 'err'; $('msg').textContent = 'Enter your name first.'; $('user').focus(); return; }
  if (!projectTeam) { $('msg').className = 'err'; $('msg').textContent = 'Choose your project team.'; $('team').focus(); return; }
  try { localStorage.setItem('hotdesk.user', user); localStorage.setItem('hotdesk.team', projectTeam); } catch {}
  if (kind === 'checkin' && confirmedTeam !== projectTeam) {
    const w = await allocationWarning(projectTeam).catch(() => null);
    if (w) {
      confirmedTeam = projectTeam;
      const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      $('msg').className = 'warn';
      $('msg').innerHTML = `<b>This desk is not pre-allocated to ${esc(projectTeam)}.</b>`
        + (w.here.allocatedTo ? `It is pre-allocated to ${esc(w.here.allocatedTo)}. ` : '')
        + (w.free.length
          ? `Free desks pre-allocated to ${esc(projectTeam)}: ${w.free.slice(0, 10).map((x) => esc(x.id)).join(', ')}${w.free.length > 10 ? ' …' : ''}. Go to one of those, or check in here anyway.`
          : `All of ${esc(projectTeam)}'s pre-allocated desks are taken right now. You can check in here anyway.`);
      $('in').textContent = 'Check in here anyway';
      return;
    }
  }
  try {
    const body = kind === 'checkin' ? { user, projectTeam, minutes: Number($('duration').value) } : { user, projectTeam };
    const seat = await call(`/api/seats/${encodeURIComponent(seatId)}/${kind}`, body);
    render(seat);
    $('in').textContent = IN_LABEL;
    $('msg').textContent = kind === 'checkin'
      ? `You are checked in (${projectTeam}) until ${fmtTime(seat.checkedInUntil)}. Scan again before then to extend.`
      : 'Thanks — the desk is free for others.';
  } catch (e) { $('msg').className = 'err'; $('msg').textContent = e.message; }
}
$('in').onclick = () => act('checkin');
$('out').onclick = () => act('checkout');

loadDurations().catch(() => {});
if (!seatId) { $('status').textContent = 'No desk specified — scan the QR code on the desk.'; }
else call(`/api/seats/${encodeURIComponent(seatId)}`).then(render).catch((e) => { $('status').textContent = e.message; });
</script>
</body>
</html>
