<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Desk</title>
<script>
  // Apply the theme chosen on the dashboard before the page paints (no flash). No choice: follow the system.
  try { const t = localStorage.getItem('hotdesk.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/app.css">
<style>
  .bk-top { background: var(--sidebar); color: #fff; }
  .bk-top-in { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
  .bk-top .brand { padding: 0; }
  .bk-top a { color: var(--sidebar-text); text-decoration: none; font-size: 13px; font-weight: 500; }
  .bk-top a:hover { color: #fff; }
  .bk-main { max-width: 1280px; margin: 0 auto; padding: 22px 24px 48px; display: grid; gap: 16px; }
  .bk-steps { display: flex; gap: 14px 24px; flex-wrap: wrap; align-items: flex-end; }
  .bk-steps label { display: grid; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .bk-steps label > span { display: flex; align-items: center; }
  .bk-steps select { min-width: 240px; font-size: 14px; padding: 8px 30px 8px 12px; }
  .bk-steps .book-sum { flex-basis: 100%; }
  .bk-legend { display: flex; gap: 6px 18px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; color: var(--text-secondary); }
  .bk-legend .litem { gap: 4px; }
  .bk-legend .ws-sample { width: 30px; height: 27px; }
  .seat.is-taken { cursor: default; }
  .mine-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-radius: 12px;
    background: var(--available-soft); border: 1px solid color-mix(in srgb, var(--available) 35%, var(--surface)); font-size: 14px; }
  .mine-bar .spacer { flex: 1; }
  .panel .pform:first-of-type { margin-top: 14px; }
  .done { text-align: left; }
  @media (max-width: 900px) { .bk-main { padding: 14px 12px 40px; } .bk-top-in { padding: 10px 14px; } .bk-steps select { min-width: 0; width: 100%; } .bk-steps label { flex: 1 1 100%; } }
</style>
</head>
<body>
<header class="bk-top">
  <div class="bk-top-in">
    <div class="brand"><img src="/static/logo.png" alt="">Book a desk</div>
    <span class="spacer"></span>
    <a href="/checkin">Enter a desk ID</a>
  </div>
</header>

<main class="bk-main">
  <div class="mine-bar" id="mine" hidden></div>

  <section class="card">
    <div class="card-head">
      <div><h2>Find a free desk</h2><p class="sub">Choose your project, then tap a free chair on the plan. You check in from now for the time you choose.</p></div>
      <span class="live" id="live">Loading…</span>
    </div>
    <div class="bk-steps">
      <label><span><span class="step">1</span>Your project team</span>
        <select id="project"><option value="">Choose your project…</option></select>
      </label>
      <label id="floorWrap" hidden><span>Floor</span>
        <div class="seg" id="floors" role="group" aria-label="Floor"></div>
      </label>
      <div class="book-sum" id="projSum"></div>
    </div>

    <div class="planwrap" style="margin-top:16px">
      <div>
        <div id="plan" aria-live="polite"></div>
        <div class="bk-legend" id="legend"></div>
      </div>
      <aside class="card panel" id="panel" aria-label="Booking"></aside>
    </div>
  </section>
</main>

<script src="/static/floorplan.js"></script>
<script src="/static/book.js"></script>
</body>
</html>
