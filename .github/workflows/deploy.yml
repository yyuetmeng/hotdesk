name: Deploy to AWS

# On every push to main: test, build the container image, push it to Amazon ECR,
# and update the CloudFormation stack (ECS Fargate + HTTPS load balancer + EFS).
# One-time AWS and GitHub setup: docs/DEPLOY.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job sign in to AWS with OIDC; no AWS keys are stored in GitHub

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  STACK_NAME: ${{ vars.STACK_NAME || 'hotdesk' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'hotdesk' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production # must match GitHubEnvironment in deploy/aws/github-access.yml
    steps:
      - name: Check AWS is configured
        id: configured
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ] || [ -z "$AWS_REGION" ] || [ -z "${{ vars.DOMAIN_NAME }}" ]; then
            echo "::notice::Not deploying: set the AWS_REGION, AWS_ROLE_ARN, AWS_CFN_ROLE_ARN and DOMAIN_NAME variables (docs/DEPLOY.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.configured.outputs.ok == 'true'

      - name: Sign in to AWS
        if: steps.configured.outputs.ok == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to Amazon ECR
        if: steps.configured.outputs.ok == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        if: steps.configured.outputs.ok == 'true'
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Update the CloudFormation stack
        if: steps.configured.outputs.ok == 'true'
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file deploy/aws/hotdesk.yml \
            --role-arn "${{ vars.AWS_CFN_ROLE_ARN }}" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ImageUri=${{ steps.image.outputs.uri }}" \
              "DomainName=${{ vars.DOMAIN_NAME }}" \
              "HostedZoneId=${{ vars.HOSTED_ZONE_ID }}" \
              "CertificateArn=${{ vars.CERTIFICATE_ARN }}" \
              "TimeZone=${{ vars.TIME_ZONE || 'Asia/Singapore' }}"

      - name: Wait for the new version to be running
        if: steps.configured.outputs.ok == 'true'
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          aws ecs wait services-stable --cluster "$(out ClusterName)" --services "$(out ServiceName)"
          URL="$(out Url)"
          echo "### Deployed ${GITHUB_SHA::7} to $URL" >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 20); do
            if curl -fsS "$URL/healthz"; then echo; exit 0; fi
            sleep 6
          done
          echo "::warning::$URL/healthz did not answer from GitHub. If DNS is not in Route 53, point $URL at $(out LoadBalancerDnsName)."
